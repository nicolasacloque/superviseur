# db, redis, api, collector, alarms, nginx (+ simulateur avec `--profile sim`).
# Nginx (HTTPS) est le seul point d'entrée web : l'api n'est joignable que sur le réseau interne.
# Certificat : deploy/gen-cert.sh (auto-signé) ou vos fichiers dans deploy/certs/.
# Les mots de passe viennent du fichier .env (copier .env.example) ; rien n'est en dur ici.

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?voir .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Le collecteur (réseau hôte) joint la base sur la boucle locale de l'hôte.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [back, hostpub]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks: [back, hostpub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *restart
    build: ./backend
    # Les migrations sont appliquées avant le démarrage de l'API.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.api.main:app --host 0.0.0.0 --port 8000
        --ws-ping-interval 30 --ws-ping-timeout 30
        --proxy-headers --forwarded-allow-ips '*'
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?voir .env.example (openssl rand -hex 32)}
      # Cookies Secure : à passer à false seulement pour un essai en HTTP sur un poste local.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_S: ${LOGIN_LOCK_S:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-730}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aucun port publié : seul nginx (réseau back) l'atteint. `--forwarded-allow-ips '*'` est sûr
    # pour cette raison : personne d'autre ne peut envoyer d'en-tête X-Forwarded-For à l'api.
    networks: [back]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Point d'entrée web : HTTPS, en-têtes de sécurité, frontend statique, relais de l'api et du WebSocket.
  nginx:
    <<: *restart
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    environment:
      # Port HTTPS non standard : HTTPS_PORT=8443 et HTTPS_PORT_SUFFIX=:8443 (pour la redirection).
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [front, back]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Seul composant qui parle BACnet. Réseau hôte : il reçoit les broadcasts du bon sous-réseau.
  collector:
    <<: *restart
    build: ./backend
    command: ["python", "-m", "app.collector.main"]
    network_mode: host
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      REDIS_URL: redis://127.0.0.1:6379/0
      COLLECTOR_CONFIG: ${COLLECTOR_CONFIG:-/config/collector.yaml}
      BACNET_BIND_IP: ${BACNET_BIND_IP:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/collector.alive')<60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # Moteur d'alarmes : règles, machine à états, notifications email et webhook.
  alarms:
    <<: *restart
    build: ./backend
    command: ["python", "-m", "app.alarms.main"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALARM_EMAIL_FROM: ${ALARM_EMAIL_FROM:-supervision@localhost}
      ALARM_EMAIL_TO: ${ALARM_EMAIL_TO:-}
      ALARM_DIGEST_THRESHOLD: ${ALARM_DIGEST_THRESHOLD:-20}
      ALARM_DIGEST_WINDOW_S: ${ALARM_DIGEST_WINDOW_S:-60}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `front` en plus de `back` : les notifications (SMTP, webhooks) sortent du serveur.
    networks: [front, back]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/alarms.alive')<60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # Simulateur BACnet (10 devices x 200 points) : `docker compose --profile sim up`.
  simulator:
    <<: *restart
    profiles: [sim]
    build: ./simulator
    network_mode: host
    environment:
      SIM_HOST: 127.0.0.1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

networks:
  front:
  back:
    internal: true
  # Réseau non interne, uniquement pour publier db et redis sur 127.0.0.1 (jamais hors du serveur).
  hostpub:

volumes:
  pgdata:
  redisdata:
