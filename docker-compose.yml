# Jalons 1-3 : db, redis, api, collector (+ simulateur avec `--profile sim`).
# Les services alarms et nginx arrivent aux jalons suivants.
# Les mots de passe viennent du fichier .env (copier .env.example) ; rien n'est en dur ici.

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?voir .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Le collecteur (réseau hôte) joint la base sur la boucle locale de l'hôte.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [back, hostpub]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks: [back, hostpub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *restart
    build: ./backend
    # Les migrations sont appliquées avant le démarrage de l'API.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.api.main:app --host 0.0.0.0 --port 8000
        --ws-ping-interval 30 --ws-ping-timeout 30
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?voir .env.example (openssl rand -hex 32)}
      # Cookies Secure : à passer à false seulement pour un essai en HTTP sur un poste local.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-730}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Publie uniquement en local en attendant Nginx + TLS (Jalon 7).
    ports:
      - "127.0.0.1:8000:8000"
    # Le réseau back est interne : api doit aussi être sur front pour publier son port.
    networks: [front, back]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Seul composant qui parle BACnet. Réseau hôte : il reçoit les broadcasts du bon sous-réseau.
  collector:
    <<: *restart
    build: ./backend
    command: ["python", "-m", "app.collector.main"]
    network_mode: host
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      REDIS_URL: redis://127.0.0.1:6379/0
      COLLECTOR_CONFIG: ${COLLECTOR_CONFIG:-/config/collector.yaml}
      BACNET_BIND_IP: ${BACNET_BIND_IP:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/collector.alive')<60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # Simulateur BACnet (10 devices x 200 points) : `docker compose --profile sim up`.
  simulator:
    <<: *restart
    profiles: [sim]
    build: ./simulator
    network_mode: host
    environment:
      SIM_HOST: 127.0.0.1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

networks:
  front:
  back:
    internal: true
  # Réseau non interne, uniquement pour publier db et redis sur 127.0.0.1 (jamais hors du serveur).
  hostpub:

volumes:
  pgdata:
  redisdata:
