# En-têtes de sécurité (section 11). `always` : présents aussi sur les erreurs 4xx/5xx.
# À inclure dans chaque bloc qui pose lui-même un add_header (Nginx n'hérite pas alors ceux du serveur).
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP stricte : aucun script inline ni externe. `style-src 'unsafe-inline'` est nécessaire car les
# widgets posent des styles calculés (couleurs, tailles) ; les images sont locales ou en data:.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
