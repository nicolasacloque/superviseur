name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          # Identifiants jetables, propres au service de CI.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supervisor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/supervisor_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            simulator/pyproject.toml
      - run: pip install -e ../simulator -e ".[dev]"
      - run: ruff check . ../simulator
      - run: ruff format --check . ../simulator
      - run: mypy
      - run: pytest --cov=app --cov-report=term-missing

  stack:
    # Critères d'acceptation des Jalons 2 et 3 sur la vraie stack Docker, avec le simulateur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer .env
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "COOKIE_SECURE=false" >> .env
          echo "COLLECTOR_CONFIG=/config/collector.sim.yaml" >> .env
      - name: Démarrer la stack avec le simulateur
        run: docker compose --profile sim up -d --build --wait --wait-timeout 240
      - name: Vérifier /health
        run: curl -fsS http://127.0.0.1:8000/health
      - name: Attendre l'import des 2000 points
        run: |
          query() { docker compose exec -T db psql -U supervisor -d supervisor -tAc "$1"; }
          for i in $(seq 1 60); do
            points=$(query "select count(*) from point_latest" || echo 0)
            echo "point_latest: ${points}"
            [ "${points:-0}" -ge 2000 ] && break
            sleep 5
          done
          test "$(query 'select count(*) from device')" = 10
          test "$(query 'select count(*) from point')" = 2000
          test "$(query 'select count(*) from point_latest')" -ge 2000
      - name: Vérifier la publication Redis
        run: |
          out=$(docker compose exec -T redis redis-cli --raw psubscribe 'point.value.*' | head -n 6 || true)
          echo "$out" | grep -q 'pmessage'
      - name: "API - connexion, lecture, écriture avec priorité, relâchement, refus"
        run: |
          B=http://127.0.0.1:8000/api/v1
          PW=mot-de-passe-ci-123
          for spec in "ci-op operator" "ci-viewer viewer"; do
            set -- $spec
            docker compose exec -T -e NEW_USER_PASSWORD=$PW api python -m app.auth.cli create-user "$1" --role "$2"
          done
          login() { curl -fsS -c "$1.jar" -H 'Content-Type: application/json' \
            -d "{\"login\":\"$1\",\"password\":\"$PW\"}" $B/auth/login > /dev/null; }
          login ci-op
          login ci-viewer
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/points)" = 401
          POINT=$(curl -fsS -b ci-op.jar "$B/points?writable=true&q=-AV-&limit=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['items'][0]['id'])")
          write() { curl -s -o /dev/null -w '%{http_code}' -b "$1.jar" -H 'Content-Type: application/json' \
            -d "$2" $B/points/$POINT/write; }
          test "$(write ci-op '{"value":42.5,"priority":8}')" = 200
          test "$(write ci-viewer '{"value":10,"priority":8}')" = 403
          for i in $(seq 1 15); do
            value=$(curl -fsS -b ci-op.jar $B/points/$POINT | python3 -c "import sys,json; print(json.load(sys.stdin)['latest']['value'])")
            [ "$value" = "42.5" ] && break
            sleep 1
          done
          test "$value" = "42.5"
          test "$(write ci-op '{"value":null,"priority":8}')" = 200
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose --profile sim logs --tail 200
      - name: Arrêter la stack
        if: always()
        run: docker compose --profile sim down -v
