[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacnet-sim"
version = "0.1.0"
description = "Simulateur BACnet/IP pour tester le superviseur (10 devices x 200 points)"
requires-python = ">=3.12"
dependencies = ["bacpypes3>=0.0.102"]

[tool.setuptools.packages.find]
include = ["bacnet_sim*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
