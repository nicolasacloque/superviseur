# Configuration du collecteur BACnet/IP (section 6.1 du cahier des charges).
# Sur un vrai réseau : adapter network.bind_ip (ou définir BACNET_BIND_IP dans .env).
network:
  name: "reseau-principal"
  bind_ip: "192.168.1.10/24"     # IP du serveur sur le sous-réseau des contrôleurs, avec masque
  port: 47808
  device_instance: 599999        # instance du superviseur lui-même
  bbmd:
    enabled: false               # true : enregistrement comme Foreign Device
    address: "192.168.1.1:47808"
    ttl: 900
discovery:
  who_is_low: 0
  who_is_high: 4194303
  interval_s: 3600
  timeout_s: 3
  targets: []                    # Who-Is unicast vers des adresses connues : ["10.0.0.7:47808"]
  ignore_name_prefixes: []       # objets dont le nom commence par ces préfixes : non importés
polling:
  default_interval_s: 30
  batch_size: 20                 # objets par ReadPropertyMultiple
  max_concurrent_requests: 5
  timeout_s: 5
  retries: 2
  offline_after_cycles: 3        # cycles sans réponse avant de passer un device hors ligne
cov:
  enabled: true
  lifetime_s: 3600
  renew_before_s: 300
  confirmed: false               # notifications non confirmées (moins de trafic)
  safety_poll_s: 300             # relecture de sécurité des points sous COV
storage:
  batch_rows: 500
  flush_s: 2
