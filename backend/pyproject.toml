[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-backend"
version = "0.1.0"
description = "Superviseur BACnet/IP - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<7",
    "bacpypes3>=0.0.102",
    "pyyaml>=6",
    "argon2-cffi>=23",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2.26",
    "websockets>=13",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Les tests dépaquettent souvent plus de valeurs qu'ils n'en utilisent.
"tests/*" = ["RUF059"]

[tool.ruff.lint.isort]
# Le dossier local alembic/ (migrations) ferait classer le paquet alembic en first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["bacpypes3.*", "bacnet_sim.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: nécessite le simulateur BACnet, une base PostgreSQL et Redis",
    "perf: mesures de performance sur TimescaleDB (long, exécutées dans un job dédié)",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy asynchrone exécute le code dans des greenlets : sans cela, coverage les ignore.
concurrency = ["greenlet", "thread"]
